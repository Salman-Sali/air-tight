[package]
name = "air-tight"
description = "Authorization for axum with Postgres-backed grants"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["authorization","axum","permissions","rbac","postgres"]
categories = ["authentication", "web-programming"]

[dependencies]
air-tight-core.workspace = true
air-tight-macros.workspace = true
axum.workspace = true
diesel.workspace = true
moka.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tower = "0.5"

[dev-dependencies]
trybuild = "1"
tower = { version = "0.5", features = ["util"] }
prettyplease = "0.2"
tokio = { workspace = true, features = ["time", "rt", "rt-multi-thread", "macros"] }
